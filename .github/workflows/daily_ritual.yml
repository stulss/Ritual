name: Daily Ritual to Discord

on:
  schedule:
    # 오전 08:50 KST (23:50 UTC) 월~금 (10분 일찍 예약하여 9시 전 도착 보장)
    - cron: '50 23 * * 0-4'
    # 오후 16:20 KST (07:20 UTC) 월~금 (10분 일찍 예약하여 16:30 전 도착 보장)
    - cron: '20 7 * * 1-5'
    # [테스트] 오후 17:25 KST (08:25 UTC) 스케줄 자동 실행 검증용
    - cron: '25 8 * * *'
  # GitHub 웹 화면에서 수동으로 즉시 테스트할 수 있도록 활성화
  workflow_dispatch:
    inputs:
      mode:
        description: '테스트 실행 모드 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon

jobs:
  run-ritual:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: pip install requests

      - name: 실행 시간 판별 및 스크립트 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 수동 실행 시 입력값 사용
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "수동 실행 (workflow_dispatch): ${{ github.event.inputs.mode }} 모드로 실행합니다."
            python send_ritual.py --mode ${{ github.event.inputs.mode }}
          else
            # 정기 스케줄 실행 시 UTC 시간에 따라 분기
            # - 아침: 23:50 UTC (KST 08:50) -> UTC 20시~23시 또는 0시~4시
            # - 오후: 07:30 UTC (KST 16:30) -> 그 외 (UTC 5시~19시)
            CURRENT_HOUR=$(date -u +%H)
            echo "스케줄 자동 실행: 현재 UTC 시간은 ${CURRENT_HOUR}시입니다."
            if [ "$CURRENT_HOUR" -ge 20 ] || [ "$CURRENT_HOUR" -lt 5 ]; then
              echo "아침 리추얼 모드(morning)로 실행합니다."
              python send_ritual.py --mode morning
            else
              echo "오후 리추얼 모드(afternoon)로 실행합니다."
              python send_ritual.py --mode afternoon
            fi
          fi
